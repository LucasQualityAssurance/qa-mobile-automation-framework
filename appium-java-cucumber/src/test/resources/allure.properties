# Pasta onde o Allure grava os resultados de cada cenário (JSON, prints e logs anexados).
# O Maven sobrescreve este valor pela propriedade allure.results.directory do pom.xml;
# este arquivo vale para a execução direto pela IDE.
# Para ver o relatório: mvn allure:serve (abre no navegador) ou mvn allure:report.
allure.results.directory=target/allure-results
