# Usado quando a feature é executada direto pela IDE (botão ▶ ao lado do arquivo .feature ou do
# cenário). Nesse modo o IntelliJ chama o Cucumber pela linha de comando, que NÃO lê o
# junit-platform.properties. Sem este arquivo, a execução pela IDE ficaria sem relatório Allure,
# sem o log das etapas e varrendo o classpath inteiro atrás dos passos.
# Mantenha as chaves iguais às do junit-platform.properties (usado pelo Maven).

cucumber.glue=steps,hooks

# O support.RegistroEtapas precisa vir ANTES do Allure: assim os anexos entram dentro do passo certo.
cucumber.plugin=support.RegistroEtapas, io.qameta.allure.cucumber8jvm.AllureCucumber8Jvm

cucumber.publish.quiet=true
cucumber.snippet-type=camelcase
