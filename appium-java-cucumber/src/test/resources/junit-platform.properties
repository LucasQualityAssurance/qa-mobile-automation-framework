# Código dos passos e dos hooks
cucumber.glue=steps,hooks

# Log das etapas (terminal + anexos no Allure), relatório Allure e resumo ao final.
# O support.RegistroEtapas precisa vir ANTES do Allure: assim os anexos entram dentro do passo certo.
cucumber.plugin=support.RegistroEtapas, io.qameta.allure.cucumber8jvm.AllureCucumber8Jvm, summary

# Um único dispositivo físico: execução sequencial obrigatória
cucumber.execution.parallel.enabled=false

# Não oferece a publicação do relatório no serviço on-line do Cucumber
cucumber.publish.quiet=true

# Nome dos cenários no IntelliJ e no Surefire: "Funcionalidade - Cenário"
cucumber.junit-platform.naming-strategy=long

# Sugestões de passos ainda não implementados em camelCase
cucumber.snippet-type=camelcase
