# =====================================================================
# Configuração padrão da execução (versionada).
#
# Os dados do SEU aparelho (udid, nome, versão) NÃO ficam aqui:
# copie config.local.properties.exemplo para config.local.properties
# (ignorado pelo Git) ou informe-os na linha de comando:
#   mvn test -Ddispositivo.udid=<udid do adb devices>
# =====================================================================

# Servidor Appium
appium.url=http://127.0.0.1:4723

# Plataforma
plataforma.nome=Android
automacao.nome=UiAutomator2

# Aplicativo
app.pacote=org.tasks
app.atividade=com.todoroo.astrid.activity.MainActivity
app.atividade.espera=*
app.sem.reset=true
app.conceder.permissoes=true

# Limpa os dados do app uma única vez, no início da suíte.
# Entre os testes o app permanece aberto (não é reiniciado).
app.limpar.dados.inicio.suite=true

# Tempos (em segundos)
tempo.comando.novo=300
tempo.espera.padrao=15
tempo.espera.curta=3

# Anexa screenshot ao relatório também nos testes aprovados
evidencia.sempre=true
